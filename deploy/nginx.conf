# PasarEx LM edge: serves both SPAs and reverse-proxies the API + WebSocket.
#   /            -> driver PWA
#   /ops         -> Ops console (built with base=/ops/)
#   /api, /socket.io -> NestJS API container
server {
  listen 80;
  server_name _;
  client_max_body_size 25m;        # allow onboarding document uploads
  root /usr/share/nginx/html;

  # API
  location /api/ {
    proxy_pass http://api:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # WebSocket (live map, tender feed, WhatsApp log)
  location /socket.io/ {
    proxy_pass http://api:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Ops console SPA under /ops
  location /ops {
    try_files $uri $uri/ /ops/index.html;
  }

  # Driver PWA SPA at root
  location / {
    try_files $uri $uri/ /index.html;
  }
}
