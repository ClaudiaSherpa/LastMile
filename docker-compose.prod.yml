# PasarEx LM — production stack for a single Droplet.
# Run with:  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
name: pasarex-lm

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      API_PORT: "3100" # must match the nginx upstream (api:3100)
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # run migrations, then boot the API (single instance)
    command: sh -c "cd /repo && npm run migration:run:prod -w @sherpa/api && npm run start -w @sherpa/api"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # host port configurable (default 80); set WEB_PORT if 80 is taken by another proxy
      - "${WEB_PORT:-80}:80"

volumes:
  db_data:
  redis_data:
